{% extends "base.html" %}

{% block content %}

    <h1>Publisher List</h1>

    <ul>
    {% for publisher in publishers %}
        <li>
            <b>Books published by {{ publisher.name }}:</b>
            <ul>
            {% for title in publisher.book_set.all %}
                    <li>{{ title.title }}</li>
            {% endfor %}
            </ul>
        </li>
    {% endfor %}
    </ul>

{% endblock content %}
